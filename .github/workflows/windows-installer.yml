name: Windows Installer - Apex Torrent 1.3.8
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller>=6,<7'
      - name: Syntax check
        shell: pwsh
        run: python -m compileall -q app tests
      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Package app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ApexTorrent --icon app/assets/apex-torrent.ico --add-data 'app/assets;assets' --paths app --hidden-import libtorrent app/main.py
          if (!(Test-Path dist/ApexTorrent/ApexTorrent.exe)) { throw 'Executable missing' }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/ApexTorrent.iss
          if (!(Test-Path release/ApexTorrent_1.3.8_Setup_x64.exe)) { throw 'Installer missing' }
          Get-FileHash release/ApexTorrent_1.3.8_Setup_x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash) *ApexTorrent_1.3.8_Setup_x64.exe" } | Set-Content release/SHA256SUMS.txt
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ApexTorrent_1.3.8_Windows_Setup
          path: |
            release/ApexTorrent_1.3.8_Setup_x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
